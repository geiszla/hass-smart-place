[project]
name = "hass-smart-place"
version = "0.0.0"
description = "Home Assistant integration for smartplace.ch + standalone client library"
requires-python = ">=3.13"
readme = "README.md"
dependencies = [
    "aiohttp>=3.10",
]

[project.optional-dependencies]
cli = [
    "click>=8.1",
    "python-dotenv>=1.0",
]
dev = [
    "ruff>=0.15.1",
    "pyright>=1.1.380",
    "pre-commit>=3.8",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "click>=8.1",
    "python-dotenv>=1.0",
]

[project.scripts]
sp-cli = "smart_place_client.client:_cli_entry"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The library lives inside the HA integration tree so HACS deploys it
# alongside ``__init__.py`` / ``manifest.json`` — without this, a fresh
# HACS install would fail with ``ModuleNotFoundError: smart_place_client``.
# The ``sources`` mapping strips the ``custom_components/smart_place``
# prefix so wheels (and the editable dev install used by tests + the
# sp-cli script) still expose the package at the top-level
# ``smart_place_client`` name.
[tool.hatch.build.targets.wheel]
packages = ["custom_components/smart_place/smart_place_client"]

[tool.hatch.build.targets.wheel.sources]
"custom_components/smart_place/smart_place_client" = "smart_place_client"

[dependency-groups]
dev = [
    "ruff>=0.15.1",
    "pyright>=1.1.380",
    "pre-commit>=3.8",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "click>=8.1",
    "python-dotenv>=1.0",
]

[tool.pyright]
# The standalone library and tests are type-checked here. The HA-facing
# files in ``custom_components/smart_place/`` need ``homeassistant``
# installed to resolve, which isn't a runtime dep of the library or tests
# — hassfest CI + manual install against the dev's HA instance cover them
# (DESIGN §7 Phase 2). The library now lives nested inside
# ``custom_components/smart_place/smart_place_client/`` (vendored for
# HACS), so include only that path and exclude the sibling HA modules.
include = ["custom_components/smart_place/smart_place_client", "tests"]
exclude = [
    "**/.*",
    "**/__pycache__",
    "**/config",
    "**/node_modules",
    "**/venv",
    "**/.venv",
    "custom_components/smart_place/__init__.py",
    "custom_components/smart_place/binary_sensor.py",
    "custom_components/smart_place/button.py",
    "custom_components/smart_place/config_flow.py",
    "custom_components/smart_place/const.py",
    "custom_components/smart_place/sensor.py",
]
typeCheckingMode = "basic"
reportUnusedImport = "none"
reportUnusedVariable = "none"
reportUnusedCoroutine = "none"
reportMissingTypeStubs = "none"
reportMissingImports = "none"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra -q --strict-markers"
markers = [
    "unit: Unit tests (fast, no external dependencies)",
]

[tool.coverage.run]
source = ["custom_components/smart_place"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@overload",
]

[tool.ruff]
required-version = ">=0.15.1"
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = [
    "A001",
    "ASYNC",
    "B",
    "BLE",
    "C",
    "D",
    "E",
    "F",
    "FLY",
    "FURB",
    "G",
    "I",
    "INP",
    "ISC",
    "ICN001",
    "LOG",
    "N804",
    "N805",
    "N815",
    "PERF",
    "PGH",
    "PIE",
    "PL",
    "PT",
    "PTH",
    "PYI",
    "RET",
    "RSE",
    "RUF",
    "SIM",
    "SLF",
    "SLOT",
    "T20",
    "TC",
    "TID",
    "TRY",
    "UP",
    "W",
]
ignore = [
    "D202",
    "D203",
    "D213",
    "D406",
    "D407",
    "D417",
    "E501",
    "PLC1901",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR2004",
    "PLW0108",
    "PLW1641",
    "PLW2901",
    "PT011",
    "PT018",
    "RUF001",
    "RUF002",
    "RUF003",
    "RUF015",
    "SIM102",
    "SIM103",
    "SIM108",
    "SIM115",
    "TC001",
    "TC002",
    "TC003",
    "TC006",
    "TRY003",
    "TRY400",
    "UP046",
    "UP047",
    "UP049",
    "W191",
    "E111",
    "E114",
    "E117",
    "D206",
    "D212",
    "D300",
    "Q",
    "COM812",
    "COM819",
    "ISC001",
    "PLE0605",
    "FURB116",
]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"async_timeout".msg = "use asyncio.timeout instead"
"pytz".msg = "use zoneinfo instead"
"tests".msg = "You should not import tests"

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["smart_place_client", "custom_components"]
combine-as-imports = true
split-on-trailing-comma = false

[tool.ruff.lint.per-file-ignores]
"scripts/*" = [
    "T20",
    "INP001",
]
"tests/*" = [
    "S101",
    "PLR2004",
    "D",
    "PTH",
    "SLF001",
]
"custom_components/smart_place/*" = [
    "D100",
    "D104",
]

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true
